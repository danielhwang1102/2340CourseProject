<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}JobPlatform{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% include 'navbar.html' %}
    
    <div class="container mt-4">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}
        
        {% block content %}
        {% endblock content %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Auto-update for Messages & Notifications -->
    {% if user.is_authenticated %}
    <script>
        // ===================================
        // Update unread MESSAGE count
        // ===================================
        function updateUnreadCount() {
            fetch('/messaging/api/unread-count/')
                .then(response => response.json())
                .then(data => {
                    const badge = document.getElementById('unread-badge');
                    if (badge && data.unread_count > 0) {
                        badge.textContent = data.unread_count;
                        badge.style.display = 'inline';
                    } else if (badge) {
                        badge.style.display = 'none';
                    }
                })
                .catch(error => console.error('Error fetching unread count:', error));
        }
        
        // ===================================
        // Update NOTIFICATION count and list
        // ===================================
        function updateNotifications() {
            // Update badge count
            fetch('/profiles/api/notifications/unread-count/')
                .then(response => response.json())
                .then(data => {
                    const badge = document.getElementById('notification-badge');
                    if (badge && data.unread_count > 0) {
                        badge.textContent = data.unread_count;
                        badge.style.display = 'inline';
                    } else if (badge) {
                        badge.style.display = 'none';
                    }
                })
                .catch(error => console.error('Error fetching notification count:', error));
            
            // Update notification list in dropdown
            fetch('/profiles/api/notifications/latest/')
                .then(response => response.json())
                .then(data => {
                    const listContainer = document.getElementById('notification-list');
                    if (!listContainer) return;
                    
                    if (data.notifications.length === 0) {
                        listContainer.innerHTML = `
                            <li class="dropdown-item text-center text-muted">
                                <small><i class="fas fa-check-circle"></i> No new notifications</small>
                            </li>
                        `;
                    } else {
                        listContainer.innerHTML = data.notifications.map(n => `
                            <li>
                                <a class="dropdown-item ${n.is_read ? 'text-muted' : ''}" 
                                   href="/profiles/notification/${n.id}/read/"
                                   style="white-space: normal; padding: 10px 15px;">
                                    <div class="d-flex align-items-start">
                                        <div class="me-2">
                                            ${n.type === 'new_match' ? '<i class="fas fa-users text-primary"></i>' : 
                                              n.type === 'application' ? '<i class="fas fa-file-alt text-success"></i>' :
                                              '<i class="fas fa-info-circle text-info"></i>'}
                                        </div>
                                        <div class="flex-grow-1">
                                            <strong style="font-size: 0.9rem;">${n.title}</strong>
                                            <p class="mb-1" style="font-size: 0.85rem;">${n.message.substring(0, 80)}${n.message.length > 80 ? '...' : ''}</p>
                                            <small class="text-muted">${n.created_at}</small>
                                        </div>
                                    </div>
                                </a>
                            </li>
                        `).join('');
                    }
                })
                .catch(error => console.error('Error fetching notifications:', error));
        }
        
        // Initial updates
        updateUnreadCount();
        updateNotifications();
        
        // Update every 30 seconds
        setInterval(updateUnreadCount, 30000);
        setInterval(updateNotifications, 30000);
    </script>
    {% endif %}
    
    {% block extra_js %}{% endblock %}
</body>
</html>
